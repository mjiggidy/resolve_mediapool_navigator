name: Build Installer

on:
  workflow_dispatch:
    inputs:
      version_number:
        required: true
        default: "v0.1"
        description: "Version number for this release"
        type: string

  release:
    types:
      - created

jobs:
  build_mac_os_notarized:
    runs-on: macos-latest
    environment: Deploy
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERT }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          ls
          . ./installers/macos/action_install_cert.sh
      - name: Build the pkg
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_APPLE_ID_PASSWORD: ${{ secrets.MACOS_APPLE_ID_PASSWORD }}
          VERSION_TAG: ${{ github.event.release.tag_name || inputs.version_number }}
        run: |
          cd ./installers/macos/
          . action_build_pkg.sh "$VERSION_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.event.release.tag_name || inputs.version_number }}
        run: |
          gh release upload "$VERSION_TAG" "${{ env.PKG_PATH }}" --clobber


  build_windows_installer:
    runs-on: windows-latest
    environment: Deploy
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the installer
        env:
          VERSION_TAG: ${{ github.event.release.tag_name || inputs.version_number }}
        shell: bash
        run: |
          installers/windows/action_build_installer.sh "$VERSION_TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.event.release.tag_name || inputs.version_number }}
        shell: bash
        run: |
          gh release upload "$VERSION_TAG" "${{ env.PKG_PATH }}" --clobber